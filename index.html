<style>
  /* Layout: full-bleed 3D view; glass panels float over it. The info panel (title, floor plan, contact)
     sits in a column on the right on wide screens and as a bottom sheet on phones; it collapses to an
     "Info" pill. Desktop walks with the keys; touch screens walk by tapping the floor. */
  :root {
    --bg: #0b0e13;
    --panel: rgba(15, 18, 24, 0.84);
    --panel-strong: rgba(15, 18, 24, 0.94);
    --fg: #efe9df;
    --muted: #aaa498;
    --line: rgba(239, 233, 223, 0.15);
    --accent: #f0b46a;
    --accent-ink: #20160a;
    --focus: #ffd59a;
    --font-display: "Avenir Next", Avenir, "Segoe UI Variable Display", "Segoe UI", "Trebuchet MS", sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-data: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --panel-w: 360px;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.45 var(--font-body);
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  #scene { position: fixed; inset: 0; touch-action: none; }
  #scene canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; -webkit-touch-callout: none; }

  .glass {
    background: var(--panel);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    border: 1px solid var(--line);
    border-radius: 14px;
  }

  /* top bar */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(12px + var(--safe-t)) var(--gutter-r) 0 var(--gutter-l);
    pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }
  .brand { margin: 0; font: 600 15px/1.2 var(--font-display); letter-spacing: 0.01em; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
  .brand small { display: block; font: 500 11px/1.3 var(--font-body); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .info-pill {
    display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px;
    border-radius: 999px; cursor: pointer; font: 600 14px var(--font-display); color: var(--fg);
  }
  .info-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  body:not(.panel-collapsed) .info-pill { visibility: hidden; }

  /* info panel */
  .listing {
    position: fixed; z-index: 4;
    top: calc(64px + var(--safe-t)); right: var(--gutter-r); bottom: calc(16px + var(--safe-b));
    width: var(--panel-w);
    display: flex; flex-direction: column;
    overflow: hidden;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  body.panel-collapsed .listing { opacity: 0; transform: translateX(16px); pointer-events: none; visibility: hidden; }
  .panel-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 10px 0 20px; flex: none; }
  .panel-bar .eyebrow { margin: 0; }
  .panel-close {
    flex: none; width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--line); background: transparent;
    cursor: pointer; color: var(--muted); display: grid; place-items: center;
  }
  .panel-close:hover { color: var(--fg); border-color: var(--accent); }
  #listing-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 18px; overscroll-behavior: contain; -webkit-user-select: text; user-select: text; }
  #listing-body > * { flex: none; }
  .l-head { display: grid; gap: 6px; }
  .eyebrow { margin: 0; font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
  .l-head h2 { margin: 0; font: 600 20px/1.25 var(--font-display); text-wrap: balance; }
  .price { margin: 6px 0 0; display: flex; align-items: baseline; gap: 2px; }
  .price .amt { font: 700 34px/1 var(--font-display); color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .per { font-size: 15px; color: var(--muted); font-weight: 500; }
  #listing-body .note { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .facts { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .fact { background: var(--panel-strong); padding: 9px 11px; min-width: 0; }
  .fact dt { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .fact dd { margin: 2px 0 0; font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .arrangement { margin: 0; font-size: 13px; color: var(--muted); }
  .plan, .contact { display: grid; gap: 10px; }
  .contact h3, .plan h3, .group summary { margin: 0; font: 600 13px/1.3 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg); }
  .minimap { margin: 0; display: grid; gap: 6px; }
  .minimap figcaption { font-size: 12px; color: var(--muted); }
  .minimap-svg { display: block; width: 100%; height: auto; max-height: 300px; background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 10px; }
  .mm-floor { fill: #2a2d33; }
  .mm-corridor { fill: #24262b; }
  .mm-private { fill: #1b1d21; }
  .mm-roomb { fill: rgba(240, 180, 106, 0.22); }
  .mm-walls rect { fill: #d9d3c8; }
  .mm-window { stroke: #8fc3e8; stroke-width: 0.12; }
  .mm-door-closed { stroke: #6f6a62; stroke-width: 0.06; }
  .mm-label { font: 600 0.42px var(--font-body); fill: #b9b2a6; }
  .mm-label-b { fill: var(--accent); font-size: 0.46px; }
  .mm-small { font-size: 0.32px; }
  .mm-muted { fill: #6c675f; font-weight: 500; font-size: 0.36px; }
  .mm-cone { fill: rgba(255, 213, 154, 0.22); }
  .mm-arrow { fill: #ffd59a; }
  .mm-dot { fill: #ffffff; stroke: var(--accent); stroke-width: 0.08; }
  .contact-row { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 8px; min-width: 0; }
  .contact-label { font-size: 12px; color: var(--muted); }
  .contact-value { font-family: var(--font-data); font-size: 13px; -webkit-user-select: all; user-select: all; overflow-wrap: anywhere; min-width: 0; }
  .copy {
    border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 12px; min-height: 32px;
    font-size: 12px; cursor: pointer; color: var(--accent);
  }
  .copy:hover { border-color: var(--accent); }
  .wechat { margin: 4px 0 0; display: flex; align-items: center; gap: 12px; }
  .wechat img { border-radius: 8px; background: #fff; width: 132px; max-width: 45%; height: auto; flex: none; }
  .wechat figcaption { font-size: 13px; color: var(--muted); }
  .group { border-top: 1px solid var(--line); padding-top: 12px; }
  .group summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
  .group summary::-webkit-details-marker { display: none; }
  .group summary::after { content: "+"; color: var(--muted); font-weight: 400; }
  .group[open] summary::after { content: "–"; }
  #listing-body .disclaimer { border-top: 1px solid var(--line); padding-top: 12px; }
  .group ul { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: grid; gap: 4px; }

  /* controls hint, reticle, note */
  .hint {
    position: fixed; z-index: 3;
    left: var(--gutter-l); bottom: calc(16px + var(--safe-b));
    max-width: min(600px, calc(100vw - var(--panel-w) - 64px));
    padding: 10px 10px 10px 14px; display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: var(--fg);
  }
  body.panel-collapsed .hint { max-width: min(600px, calc(100vw - 32px)); }
  .hint-close {
    flex: none; border: 1px solid var(--line); background: transparent; border-radius: 999px; width: 30px; height: 30px;
    cursor: pointer; color: var(--muted); font-size: 15px; line-height: 1;
  }
  .hint-close:hover { color: var(--fg); border-color: var(--accent); }
  .reticle {
    position: fixed; z-index: 2; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
    border-radius: 50%; background: rgba(255, 255, 255, 0.75); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45); pointer-events: none;
  }
  .toast {
    position: fixed; z-index: 7; left: 50%; top: calc(72px + var(--safe-t)); transform: translateX(-50%);
    padding: 9px 16px; font-weight: 600; font-size: 14px; color: var(--fg); pointer-events: none;
    max-width: calc(100vw - 32px); text-align: center;
  }

  /* loading: a real progress bar (engine download, building rooms, preparing materials) */
  .loading { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; background: var(--bg); color: var(--muted); padding: 0 24px; }
  .loading-card { width: min(320px, 100%); display: grid; gap: 12px; text-align: center; }
  .loading-title { margin: 0; font: 600 17px/1.3 var(--font-display); color: var(--fg); }
  .loading-bar { height: 6px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .loading-bar span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width 0.25s ease; }
  .loading-step { margin: 0; font: 500 13px/1.4 var(--font-body); min-height: 1.4em; font-variant-numeric: tabular-nums; }

  body.shot .ui { display: none !important; }

  /* phones and narrow windows: the panel becomes a bottom sheet */
  @media (max-width: 899px) {
    .listing {
      top: auto; left: 0; right: 0; bottom: 0; width: auto;
      max-height: min(72vh, 640px);
      border-radius: 16px 16px 0 0; border-bottom: 0;
      padding-bottom: var(--safe-b);
    }
    body.panel-collapsed .listing { transform: translateY(24px); }
    .panel-bar { padding: 10px max(10px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
    #listing-body { padding: 8px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
    .hint { left: var(--gutter-l); right: var(--gutter-r); max-width: none; bottom: auto; top: calc(64px + var(--safe-t)); }
    body.panel-collapsed .hint { max-width: none; }
    .brand small { display: none; }
    .minimap-svg { max-height: 240px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .listing, .loading-bar span { transition: none; }
  }
</style>
</head>
<body>
<div id="scene" aria-label="3D view of the apartment"></div>

<div class="ui">
  <header class="topbar">
    <h1 class="brand">Room tour<small>U District, Seattle</small></h1>
    <button type="button" class="info-pill glass" id="info-pill" aria-controls="listing" aria-expanded="false"><span class="dot" aria-hidden="true"></span>Info</button>
  </header>

  <div class="reticle" aria-hidden="true"></div>
  <div class="toast glass" id="note" role="status" hidden></div>

  <div class="hint glass" id="hint">
    <span id="hint-text">WASD move · Arrow keys look around · Space jump · Drag to look · E or click to use doors and appliances</span>
    <button type="button" class="hint-close" id="hint-close" aria-label="Dismiss controls hint">×</button>
  </div>

  <aside class="listing glass" id="listing" aria-labelledby="listing-title">
    <div class="panel-bar">
      <p class="eyebrow">About this room</p>
      <button type="button" class="panel-close" id="panel-close" aria-label="Collapse info panel" aria-controls="listing">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="listing-body"></div>
  </aside>

  <div class="loading" id="loading" role="progressbar" aria-label="Loading the tour" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="loading-card">
      <p class="loading-title">Setting up the apartment</p>
      <div class="loading-bar"><span id="loading-fill"></span></div>
      <p class="loading-step" id="loading-step">Starting…</p>
    </div>
  </div>
</div>

    }

</script>

</body>
